services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-secure-random-string}
      SSH_CREDENTIAL_KEY: ${SSH_CREDENTIAL_KEY:-must-be-exactly-32-bytes-long!!!}
      TZ: ${TZ:-Asia/Shanghai}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATABASE_URL: data/serverdock.db
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DEBUG: ${DEBUG:-false}
      PORT: 8000
    volumes:
      - serverdock-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${HTTPS_PORT:-${PORT:-443}}:443"
    volumes:
      - type: bind
        source: ${TLS_CERT_PATH:-./certs/serverdock.crt}
        target: /etc/nginx/tls/serverdock.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:-./certs/serverdock.key}
        target: /etc/nginx/tls/serverdock.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --loglevel info run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_URL: ${CLOUDFLARE_TUNNEL_URL:-http://frontend:80}
    depends_on:
      - frontend
    profiles:
      - cloudflare
    restart: unless-stopped

volumes:
  serverdock-data:
