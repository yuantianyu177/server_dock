services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      DEBUG: "true"
    volumes: !override
      - ./backend:/app
      - serverdock-data-dev:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: !reset null
    image: node:26.7.0-alpine3.24
    working_dir: /app
    command: sh -c "npm install --global npm@12.0.2 && npm ci && npm run dev -- --host"
    environment:
      BACKEND_URL: http://backend:8000
      TLS_CERT_PATH: /etc/nginx/tls/serverdock.crt
      TLS_KEY_PATH: /etc/nginx/tls/serverdock.key
    volumes: !override
      - ./frontend:/app
      - node_modules:/app/node_modules
      - type: bind
        source: ${TLS_CERT_PATH:-./certs/serverdock.crt}
        target: /etc/nginx/tls/serverdock.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:-./certs/serverdock.key}
        target: /etc/nginx/tls/serverdock.key
        read_only: true
        bind:
          create_host_path: false
    ports: !override
      - "${DEV_HTTPS_PORT:-3000}:3000"

volumes:
  serverdock-data-dev:
  node_modules:
