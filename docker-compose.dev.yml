services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      DEBUG: "true"
    volumes: !override
      - ./backend:/app
      - serverdock-data-dev:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: !reset null
    image: node:26.7.0-alpine3.24
    working_dir: /app
    command: sh -c "npm install --global npm@12.0.2 && npm ci && npm run dev -- --host"
    environment:
      BACKEND_URL: http://backend:8000
    volumes: !override
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports: !override
      - "3000:3000"

volumes:
  serverdock-data-dev:
  node_modules:
