services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-secure-random-string}
      - SSH_CREDENTIAL_KEY=${SSH_CREDENTIAL_KEY:-must-be-exactly-32-bytes-long!!!}
      - DATABASE_URL=data/serverdock.db
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - DEBUG=true
      - PORT=8000
    volumes:
      - ./backend:/app
      - serverdock-data-dev:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "8080:3000"
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  serverdock-data-dev:
  node_modules:
